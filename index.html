<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>現場写真アップロード</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1a73e8" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <h1>現場写真アップロード</h1>
  <div id="app-version" class="app-version"></div>
  <button id="btn-settings" class="settings-btn" type="button" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<div id="status-message" class="status-message"></div>

<!-- ログイン画面 -->
<section id="screen-login" class="screen">
  <div class="card">
    <p>Googleアカウントでログインしてください。</p>
    <button id="btn-login" class="btn-primary">Googleでログイン</button>
  </div>
</section>

<!-- メイン画面 -->
<section id="screen-main" class="screen hidden">
  <nav class="tabs">
    <button id="tab-main" class="tab active">アップロード</button>
    <button id="tab-history" class="tab">履歴</button>
  </nav>

  <div id="panel-main" class="panel">
    <div class="card">
      <h3 class="step-title">STEP1：写真の保存先を決める</h3>
      <label>① 顧客名</label>
      <select id="select-customer"></select>

      <label>② 施工現場</label>
      <select id="select-site" disabled></select>

      <label>③ 施工年月</label>
      <select id="select-yearmonth"></select>
    </div>

    <div class="card">
      <h3 class="step-title">STEP2：保存する写真を選ぶ</h3>
      <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple />
      <div id="selected-files-info" class="muted">写真が選択されていません</div>
    </div>

    <button id="btn-upload" class="btn-primary">アップロード実行</button>
  </div>

  <div id="panel-history" class="panel hidden">
    <h2>この端末の履歴(本日分)</h2>
    <button id="btn-retry-all" class="btn-secondary retry-all-btn hidden"></button>
    <div id="local-history-list"></div>

    <h2>全体共有履歴(過去1週間)</h2>
    <div id="shared-history-list"></div>
  </div>
</section>

<!-- 新規作成モーダル -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <input id="modal-text-input" type="text" placeholder="入力してください" />
    <input id="modal-month-input" type="month" class="hidden" />
    <div class="modal-buttons">
      <button id="modal-cancel" class="btn-secondary">キャンセル</button>
      <button id="modal-confirm" class="btn-primary">登録</button>
    </div>
  </div>
</div>

<!-- アップロード進捗モーダル -->
<div id="upload-modal-overlay" class="modal-overlay hidden">
  <div class="modal upload-modal">
    <h3>アップロード</h3>

    <div class="upload-modal-status">
      <div id="upload-modal-spinner" class="spinner hidden"></div>
      <div id="upload-modal-stage" class="upload-modal-stage"></div>
    </div>

    <div class="upload-progress-block">
      <div class="upload-progress-label">
        <span>全体進捗</span>
        <span id="upload-overall-count"></span>
      </div>
      <div class="progress-bar-outer"><div id="upload-overall-bar" class="progress-bar-inner"></div></div>
      <div class="progress-status" id="upload-overall-status"></div>
    </div>

    <div class="upload-progress-block">
      <div class="upload-progress-label"><span>ファイル別進捗</span></div>
      <div id="upload-file-progress-list" class="progress-list"></div>
    </div>

    <div id="upload-modal-warning" class="warning">
      アップロード中は画面を閉じたり、ロックしたりしないでください。
    </div>
    <div id="upload-modal-message" class="muted hidden"></div>

    <div class="modal-buttons">
      <button id="btn-upload-cancel" class="btn-secondary">中断</button>
      <button id="btn-upload-close" class="btn-primary hidden">閉じる</button>
    </div>
  </div>
</div>

<!-- 設定画面。下からスライドして表示するシート -->
<div id="screen-settings" class="settings-sheet">
  <div class="settings-sheet-header">
    <h2>設定</h2>
    <button id="btn-settings-close" class="icon-close-btn" type="button" aria-label="閉じる">&times;</button>
  </div>
  <div class="settings-sheet-body">
    <div class="card">
      <h3 class="step-title">ユーザー情報</h3>
      <p class="muted">
        履歴画面の共有履歴に表示される氏名です。アップロード完了メールの宛先にも使用されます。
      </p>
      <label>氏名</label>
      <input id="profile-name-input" type="text" placeholder="例：山田太郎" />
      <label>メールアドレス</label>
      <input id="profile-email-input" type="email" placeholder="example@example.com" />
      <button id="btn-profile-save" class="btn-primary">保存</button>
      <div id="profile-save-message" class="muted hidden"></div>
    </div>
  </div>
</div>

<script src="js/version.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/drive.js"></script>
<script src="js/compress.js"></script>
<script src="js/notify.js"></script>
<script src="js/main.js"></script>
</body>
</html>
